apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: production
data:
  # Internal cluster URL used by Next.js server-side rendering (SSR/RSC)
  STRAPI_INTERNAL_URL: "http://cms.production.svc.cluster.local:1337"
  # Public URL used by the browser (must be externally reachable)
  NEXT_PUBLIC_STRAPI_URL: "https://cms.aisaph.com"
  NEXT_PUBLIC_SITE_URL: "https://aisaph.com"
  NODE_ENV: "production"
  # Email SMTP
  SMTP_HOST: "mail.aisaph.com"
  SMTP_PORT: "465"
  SMTP_SECURE: "true"
  SMTP_USER: "matriculas@aisaph.com"
  MAIL_FROM: "AISAPH-CV <matriculas@aisaph.com>"
